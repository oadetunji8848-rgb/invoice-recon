name: Reconciliation pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v

  reconcile:
    name: Run reconciliation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reconcile sample invoices against the bank ledger
        shell: bash  # enables pipefail so a crash isn't hidden by tee
        run: python reconciler.py --invoices sample_invoices --ledger bank_ledger.csv --out output -v | tee output.txt
      - name: Job summary
        run: |
          {
            echo '## Reconciliation results'
            echo '```'
            cat output.txt
            echo '```'
            echo 'Download **reconciliation-output** below for the Excel report and JSON queues.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-output
          path: output/
          retention-days: 30
